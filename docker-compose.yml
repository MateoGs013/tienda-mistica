# Tienda Mística — app PHP + MariaDB, autocontenido.
# Local:  cp .env.example .env  &&  docker compose up -d --build   ->  http://localhost:8080
# Coolify: mismo compose; definir las variables en el panel y el dominio hacia el servicio `app`.

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-tienda_mistica}
      DB_USER: ${DB_USER:-tienda}
      DB_PASS: ${DB_PASS:-cambia-esto}
      APP_BASE_PATH: ${APP_BASE_PATH:-/}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - uploads:/var/www/html/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-tienda_mistica}
      MARIADB_USER: ${DB_USER:-tienda}
      MARIADB_PASSWORD: ${DB_PASS:-cambia-esto}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-cambia-esto-root}
    volumes:
      - mariadb_data:/var/lib/mysql
      # Import automático del esquema + datos en el PRIMER arranque (volumen vacío).
      - ./sql/tienda_mistica.sql:/docker-entrypoint-initdb.d/01-tienda.sql:ro
      # Producción: borra cuentas y datos personales de desarrollo tras el dump.
      - ./docker/initdb/20-prod-clean.sql:/docker-entrypoint-initdb.d/20-prod-clean.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  uploads:
  mariadb_data:
