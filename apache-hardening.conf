# Endurecimiento de Apache para Tienda Mística.

# Sin listados de directorio en todo el sitio.
<Directory /var/www/html>
    Options -Indexes
</Directory>

# Las librerías internas no se sirven directamente por HTTP.
<DirectoryMatch "^/var/www/html/(includes|classes)/">
    Require all denied
</DirectoryMatch>

# En uploads nunca se ejecuta código (defensa en profundidad sobre el whitelist).
<Directory /var/www/html/uploads>
    php_admin_flag engine off
    Options -ExecCGI -Indexes
    <FilesMatch "\.(?:php[0-9]?|phtml|phar|phps|cgi|pl|py|sh)$">
        Require all denied
    </FilesMatch>
</Directory>
